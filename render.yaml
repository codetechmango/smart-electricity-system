services:
  # FastAPI Backend Service
  - type: web
    name: smart-electricity-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-electricity-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ALLOWED_ORIGINS
        value: "*" # Set this to your frontend URL after deploying the frontend

databases:
  # Managed PostgreSQL Database
  - name: smart-electricity-db
    plan: free
